name: ✨ 功能请求
about: 提出一个新功能想法
title: "✨ [Feature] "
labels: ["enhancement", "feature"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您为项目提出新功能想法！请确保搜索现有的问题，以避免重复提交。

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰简洁地描述您想要的功能
      placeholder: 告诉我们您想要添加什么功能...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 功能动机
      description: 为什么您需要这个功能？它解决了什么问题？
      placeholder: 请解释为什么这个功能很重要...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您是否考虑过任何替代方案或实现方式？
      placeholder: 请描述您考虑过的替代方案...

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 在此处添加任何其他相关信息或截图
      placeholder: 任何有助于理解此功能请求的信息...