[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse-ai"
dynamic = ["version"]
description = "基于 FastAPI 和 Streamlit 的开源项目健康诊断工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "YanLeaf AI Lab", email = "yanleaf@yanleaf.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "streamlit>=1.51.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.45",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "pygithub>=2.8.1",
    "pyecharts>=1.9.1",
    "streamlit-echarts>=0.4.0",
    "markdown2>=2.5.4",
    "pdfkit>=0.6.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "flake8>=7.3.0",
    "black>=25.11.0",
    "mypy>=1.18.2",
    "isort>=7.0.0",
    "gitpython>=3.1.45",
    "aiohttp>=3.13.2",
    "altair>=5.5.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "pycairo>=1.29.0",
    "xhtml2pdf>=0.2.17",
    "reportlab>=4.1.0",
    "pytz>=2025.2",
    "tzdata>=2025.2",
    "pyjwt>=2.10.1",
    "authlib>=1.6.5",
    "cryptography>=46.0.3",
    "pillow>=12.0.0",
    "tiktoken>=0.12.0",
    "tornado>=6.5.2",
    "pyarrow>=21.0.0",
    "pydeck>=0.9.1",
    "tenacity>=9.1.2",
    "typing-extensions>=4.15.0",
    "watchdog>=6.0.0",
    "zopfli>=0.4.0",
    "flower>=2.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "black>=25.11.0",
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "isort>=7.0.0",
    "pre-commit>=4.4.0",
    "tox>=4.23.2",
    "virtualenv>=20.35.4"
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.38",
    "mkdocstrings>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/zhouyanye/codepulse-ai"
Repository = "https://github.com/zhouyanye/codepulse-ai"
Documentation = "https://github.com/zhouyanye/codepulse-ai/wiki"
Changelog = "https://github.com/zhouyanye/codepulse-ai/releases"

[project.scripts]
codepulse-ai = "run:main"
codepulse-api = "app.main:main"
codepulse-web = "web.main:main"

[tool.setuptools]
packages = ["app", "services", "models", "utils", "web", "docs"]

[tool.setuptools.dynamic]
version = {attr = "run.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["app", "services", "models", "utils"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = ["app", "services", "models", "utils", "web"]
known_third_party = ["fastapi", "uvicorn", "streamlit", "celery", "redis", "sqlalchemy", "pydantic", "requests", "pytest"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503"   # line break before binary operator
]
per-file-ignores = [
    "__init__.py:F401"  # imported but unused
]