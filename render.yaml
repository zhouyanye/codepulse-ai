services:
  # 1. FastAPI 后端服务
  - type: web
    name: codepulse-api  
    runtime: python
    buildCommand: pip install -r requirements.txt  
    startCommand: uvicorn run:app --host 0.0.0.0 --port $PORT  
    # 环境变量
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITEE_TOKEN
        sync: false
    autoDeploy: true
    healthCheckPath: /health

  # 2. Streamlit 前端服务
  - type: web
    name: codepulse-web  
    runtime: python
    buildCommand: pip install -r requirements.txt 
    startCommand: streamlit run web/main.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        sync: false 
      - key: GITHUB_TOKEN
        sync: false
      - key: GITEE_TOKEN
        sync: false
    autoDeploy: true

previewsEnabled: true
previewPlan: free
previewSuffix: "pr-${PR_NUMBER}"